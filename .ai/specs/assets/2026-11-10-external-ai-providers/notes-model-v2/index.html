<!doctype html>
<html lang="en" data-prototype-id="lintel-app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lintel notes model mockup v2</title>
<style>
*{box-sizing:border-box}
:root{--ts:1}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:#d9d5cc;color:#191610}
body.dark{background:#0c0a08;color:#F1EEE9}
.light{--win:#F6F4F0;--side:#E7E4DE;--card:#fff;--ink:#191610;--sec:#6B645A;--hair:rgba(25,22,16,.11);--accent:#267C6C;--atext:#036152;--tint:rgba(38,124,108,.14);--onacc:#fff;--ok:#1E8E3E;--att:#B25E00;--er:#D70015;--glass:rgba(255,255,255,.72);--fill:rgba(25,22,16,.06)}
.dark{--win:#1C1915;--side:#141210;--card:#26221E;--ink:#F1EEE9;--sec:#A39B8F;--hair:rgba(255,255,255,.11);--accent:#6BBDAB;--atext:#6BBDAB;--tint:rgba(107,189,171,.20);--onacc:#161310;--ok:#32D74B;--att:#FF9F0A;--er:#FF6961;--glass:rgba(38,34,30,.72);--fill:rgba(255,255,255,.08)}
#bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:8px 16px;background:#191610;color:#F1EEE9;font-size:13px}
#bar nav{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
#bar a{color:#9fdccd;text-decoration:none}
.seg{display:inline-flex;border:1px solid #5a544b;border-radius:7px;overflow:hidden}
.seg button{background:none;color:#F1EEE9;border:0;padding:3px 10px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:#6BBDAB;color:#161310;font-weight:600}
main{padding:16px 24px 80px;max-width:1280px;margin:auto}
.doc{background:#fff;color:#191610;border-radius:10px;padding:8px 24px 20px;margin:20px 0}
.doc h2,h2.sec{font-size:22px;margin:32px 0 6px}
.doc h3{font-size:16px;margin:20px 0 4px}
.doc table{border-collapse:collapse;font-size:13px;margin:8px 0;width:100%}
.doc td,.doc th{border:1px solid #ddd;padding:5px 9px;text-align:left;vertical-align:top}
.doc th{background:#f3f0ea}
.doc code{background:#eee;padding:0 4px;border-radius:3px}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;background:#e7e4de}
.keep{background:#d6efdf}.simp{background:#fbe9c8}.reth{background:#f9d4d0}.miss{background:#d8e3f7}
h2.sec{color:inherit}
figure.scr{margin:22px 0}
figure.scr>figcaption{font-size:12px;opacity:.75;margin-bottom:5px}
figure.scr>figcaption b{font-family:ui-monospace,monospace;opacity:1}
/* window */
.win{width:1040px;height:680px;display:flex;position:relative;font-size:calc(13px*var(--ts));background:var(--win);color:var(--ink);border:1px solid var(--hair);border-radius:12px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.22)}
.win.sm{width:600px;height:auto;min-height:0}
.lights{display:flex;gap:7px;padding:14px 14px 6px}.lights i{width:12px;height:12px;border-radius:50%;background:#8883}
.side{width:min(14.5em,215px);flex:none;background:var(--side);display:flex;flex-direction:column;padding-bottom:12px;border-right:1px solid var(--hair);overflow:hidden}
.brand{display:flex;gap:8px;align-items:center;font-weight:600;padding:8px 14px 12px;font-size:1.05em}
.brand svg{width:20px;height:20px}
.sg{font-size:.82em;font-weight:600;color:var(--sec);padding:10px 14px 3px}
.si{display:flex;gap:8px;align-items:center;margin:1px 8px;padding:5px 8px;border-radius:7px;color:var(--ink)}
.si .n{margin-left:auto;color:var(--sec);font-size:.9em}.si .n.att-t{color:var(--att)}
.si.on{background:var(--tint)}.si.on .l{color:var(--atext);font-weight:600}.si.off .l{color:var(--sec)}
.si .off-t{margin-left:auto;font-size:.8em;color:var(--sec)}
.sp{flex:1}
.setbtn{margin:0 8px;display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;border:0;background:none;font:inherit;color:var(--ink);text-align:left}
.setbtn kbd{margin-left:auto}
.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.si .ic{color:var(--sec)}.si.on .ic{color:var(--atext)}
kbd{font:600 .82em -apple-system,sans-serif;background:var(--fill);border-radius:5px;padding:1px 6px;color:var(--sec)}
/* list */
.list{width:min(23em,330px);flex:none;border-right:1px solid var(--hair);display:flex;flex-direction:column;background:var(--win)}
.lh{padding:12px 12px 8px}
.search{display:flex;gap:8px;align-items:center;background:var(--fill);border-radius:8px;padding:6px 10px;color:var(--sec)}
.search .q{color:var(--ink)}
.rows{overflow:hidden;flex:1;padding:0 6px}
.rw{display:flex;gap:10px;padding:8px;border-radius:8px;position:relative}
.rw.sel{background:var(--tint)}.rw.sel:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--accent)}
.kind{width:2em;height:2em;border-radius:7px;background:var(--fill);display:grid;place-items:center;color:var(--sec);flex:none}
.rw .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .s{color:var(--sec);font-size:.92em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rw .m{color:var(--sec);font-size:.85em;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rw .b1{min-width:0;flex:1}
mark{background:var(--tint);color:var(--atext);border-radius:3px;font-weight:600;padding:0 1px}
.badge{align-self:flex-start;font-size:.82em;border-radius:9px;padding:0 7px;border:1px solid var(--hair);color:var(--sec);white-space:nowrap}
.badge.att{color:var(--att);border-color:currentColor}.badge.er{color:var(--er);border-color:currentColor}.badge.acc{color:var(--atext);border-color:currentColor}
.rd{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--win)}
.rh{padding:18px 24px 10px}
.rh h3{margin:0;font-size:1.55em;line-height:1.2}
.rh .meta{color:var(--sec);margin-top:3px}
.acts{display:flex;gap:8px;margin:12px 0 0;flex-wrap:wrap}
.tabs{display:inline-flex;background:var(--fill);border-radius:8px;padding:2px;margin:12px 0 0}
.tabs span{padding:3px 14px;border-radius:6px}.tabs .on{background:var(--card);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.rb{padding:6px 24px 20px;overflow:auto;flex:1}
.rb h4{margin:16px 0 4px;font-size:.88em;color:var(--sec);text-transform:none}
.rb ul{margin:0;padding-left:1.2em}.rb li{margin:3px 0}
.q{color:var(--atext);font-size:.85em;margin-left:6px;white-space:nowrap}
.spk{display:flex;gap:10px;padding:6px 0}.spk .who{width:5.5em;flex:none;font-weight:600}.spk .tm{color:var(--sec);font-size:.85em;width:3.2em;flex:none}
/* buttons */
.btn{font:inherit;font-weight:600;border-radius:8px;padding:5px 12px;border:1px solid var(--hair);background:var(--card);color:var(--ink);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--onacc);border-color:transparent}
.btn.dng{color:var(--er)}.btn.dng.fill{background:var(--er);color:#fff;border-color:transparent}
.btn.sm{padding:2px 9px;font-size:.92em}
.btn[disabled]{opacity:.45}
.sw{width:2.5em;height:1.45em;border-radius:1em;background:var(--hair);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:.15em;left:.15em;width:1.15em;height:1.15em;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw.on{background:var(--accent)}.sw.on:after{left:1.2em}
.sel-c{display:inline-flex;gap:6px;align-items:center;color:var(--sec)}
/* banner */
.bn{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--hair);margin:0 0 14px}
.bn .g{width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;background:var(--sec)}
.bn.ok .g{background:var(--ok)}.bn.att .g{background:var(--att)}.bn.er .g{background:var(--er)}.bn.acc .g{background:var(--accent);color:var(--onacc)}
.bn .tx{flex:1;min-width:0}.bn .tt{font-weight:600}.bn .ss{color:var(--sec);font-size:.92em}
.bn .ba{display:flex;gap:8px;flex-wrap:wrap}
.bn.ok .g,.bn.att .g,.bn.er .g{color:#fff}.dark .bn.ok .g,.dark .bn.att .g,.dark .bn.er .g{color:#161310}
.prog{height:4px;border-radius:2px;background:var(--hair);margin-top:6px}.prog i{display:block;height:4px;border-radius:2px;background:var(--accent)}
.rd .bn{margin:0 24px 8px}
/* settings pane */
.pane{flex:1;overflow:auto;padding:20px 28px;min-width:0;position:relative}
.pane>.in{max-width:640px;margin:auto}
.pane h3{margin:0 0 12px;font-size:1.5em}
.sh{font-size:.82em;font-weight:600;color:var(--sec);margin:18px 0 5px 4px}
.card{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:2px 14px}
.fr{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--hair);min-height:2.6em}
.fr:first-child{border-top:0}
.fr .lb{min-width:0}.fr .hp{color:var(--sec);font-size:.9em}
.fr .v{color:var(--sec);display:flex;gap:8px;align-items:center;flex:none}
.ft{color:var(--sec);font-size:.88em;margin:5px 4px 0}
.disc{display:flex;gap:6px;align-items:center;color:var(--sec);font-weight:600;font-size:.88em;margin:16px 4px 0}
.chip{font-size:.8em;border-radius:9px;padding:0 7px;background:var(--fill);color:var(--sec);white-space:nowrap}
.ok-t{color:var(--ok)}.att-t{color:var(--att)}.er-t{color:var(--er)}
.dim{opacity:.5}
.skel{background:var(--fill);border-radius:6px;height:1em;margin:6px 0}
/* sheet */
.stage{position:relative;width:640px;height:300px;border-radius:12px;background:linear-gradient(135deg,#c9c3b6,#9a948a);display:grid;place-items:center;font-size:calc(13px*var(--ts))}
.dark .stage{background:linear-gradient(135deg,#3a3630,#1f1c18)}
.sheet{width:380px;background:var(--win);color:var(--ink);border:1px solid var(--hair);border-radius:14px;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.sheet h5{margin:0 0 4px;font-size:1.1em}.sheet p{margin:0;color:var(--sec)}
.sheet .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn.def{box-shadow:0 0 0 2px var(--accent)}
/* menu, hud */
.menu{width:300px;border-radius:10px;background:var(--glass);backdrop-filter:blur(30px);border:1px solid var(--hair);padding:5px;font-size:calc(13px*var(--ts));color:var(--ink)}
.mi{display:flex;gap:8px;padding:3px 10px;border-radius:5px;align-items:center}.mi kbd{margin-left:auto;background:none}.mi.hl{background:var(--accent);color:var(--onacc)}.mi.hl kbd{color:var(--onacc)}
.msep{height:1px;background:var(--hair);margin:4px 8px}
.rdot{width:.6em;height:.6em;border-radius:50%;background:var(--er)}
.cap{white-space:nowrap;height:2.9em;border-radius:1.5em;background:var(--glass);backdrop-filter:blur(30px);border:1px solid var(--hair);display:inline-flex;align-items:center;gap:10px;padding:0 14px;font-weight:500;color:var(--ink);font-size:calc(14px*var(--ts))}
.bars{display:inline-flex;gap:3px;align-items:center;height:1.2em}.bars i{width:3px;border-radius:2px;background:var(--accent)}
.wall{width:640px;padding:22px 16px;border-radius:12px;background:linear-gradient(135deg,#c9c3b6,#9a948a);display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:center}
.dark .wall{background:linear-gradient(135deg,#3a3630,#1f1c18)}
.blur{filter:blur(6px);user-select:none}
.big{font-size:1.6em;margin:0 0 4px}
@media(prefers-reduced-motion:no-preference){.bars i{animation:b 1s ease-in-out infinite alternate}@keyframes b{to{transform:scaleY(.5)}}}

/* ===== v2 Notes: Orca-like, dense, tool feel ===== */
.win{width:1180px;height:720px}
.side{width:min(19em,250px)}
.win.nt{flex-direction:column;font-size:calc(12.5px*var(--ts))}
.nt .wb{flex:1;display:flex;min-height:0}
.sp{flex:1}
.dot{width:.55em;height:.55em;border-radius:50%;flex:none;background:var(--sec)}
.dot.ok{background:var(--ok)}.dot.acc{background:var(--accent)}.dot.att{background:var(--att)}.dot.er{background:var(--er)}.dot.mute{background:var(--hair)}.dot.ne{background:var(--sec)}
.ex{width:min(19em,250px);flex:none;background:var(--side);border-right:1px solid var(--hair);display:flex;flex-direction:column;min-width:0}
.exs{display:flex;gap:8px;align-items:center;margin:6px 10px;padding:6px 10px;border-radius:7px;background:var(--fill);color:var(--sec)}.exs .qq{color:var(--ink)}
.exl{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 4px;color:var(--sec);font-weight:600;font-size:.9em}.exl b{font-weight:600;margin-left:4px;opacity:.7}.exl .ico{display:flex;gap:10px}
.exb{flex:1;overflow:hidden;padding:2px 0}
.grp{display:flex;gap:6px;align-items:center;padding:6px 14px 2px;color:var(--sec);font-size:.85em;font-weight:600}.grp span{margin-left:auto;font-weight:400}
.tr2{display:flex;gap:9px;padding:6px 10px;margin:1px 6px;border-radius:7px;align-items:flex-start}
.tr2 .dot{margin-top:.45em}
.tr2.on{background:var(--tint)}
.tr2 .tx{min-width:0;flex:1}.tr2 .a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}.tr2.on .a{color:var(--atext)}
.tr2 .b{color:var(--sec);font-size:.88em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tr2 .b mark{white-space:normal}
.tr2 .c{font-size:.85em;margin-top:1px;color:var(--sec)}.tr2 .c.acc{color:var(--atext)}.tr2 .c.att{color:var(--att)}.tr2 .c.er{color:var(--er)}
.nr{padding:18px 18px;color:var(--sec);text-align:center}
.exf{display:flex;align-items:center;padding:8px 14px;border-top:1px solid var(--hair);color:var(--sec)}.lnk2{display:inline-flex;gap:8px;align-items:center}
.cn{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--win);position:relative}
.tbs{display:flex;align-items:stretch;height:2.7em;background:var(--side);border-bottom:1px solid var(--hair)}
.tb{flex:0 1 12em;display:flex;gap:7px;align-items:center;padding:0 10px 0 12px;border-right:1px solid var(--hair);color:var(--sec);min-width:0;max-width:15em}
.tb .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tb.on{background:var(--win);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.tb .x{opacity:.5;display:grid}.tb.pl{padding:0 12px}
.mk{color:var(--att);font-size:.8em}.spin{display:inline-grid;color:var(--atext)}
.cmdb{display:flex;gap:8px;align-items:center;padding:0 14px;color:var(--sec)}
.crb{display:flex;align-items:center;height:2.6em;padding:0 12px 0 16px;border-bottom:1px solid var(--hair);color:var(--sec)}
.pth{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em}
.ibs{display:flex;gap:2px}.ib{width:2.1em;height:2.1em;display:grid;place-items:center;border-radius:6px;color:var(--sec)}.ib.on{background:var(--tint);color:var(--atext)}
.fmt{display:flex;align-items:center;gap:2px;height:2.7em;padding:0 12px;border-bottom:1px solid var(--hair);background:var(--fill);color:var(--sec)}
.fmt .f{min-width:2em;height:2em;display:inline-grid;place-items:center;padding:0 5px;border-radius:6px;font-weight:600}.fmt i{width:1px;height:1.3em;background:var(--hair);margin:0 6px}
.fmt .cb{margin-left:auto;gap:6px;display:inline-flex;align-items:center;color:var(--atext)}
.strip{display:flex;align-items:center;gap:10px;min-height:2.3em;padding:0 16px;border-bottom:1px solid var(--hair);font-size:.95em}
.strip.att{background:color-mix(in srgb,var(--att) 11%,transparent)}.strip.er{background:color-mix(in srgb,var(--er) 11%,transparent)}.strip.acc{background:var(--tint)}.strip.ne{background:var(--fill)}
.lnk{color:var(--atext);font-weight:600;margin-left:10px;white-space:nowrap}
.ed{flex:1;overflow:auto;padding:0 0 24px}
.dh{padding:20px 24px 8px 5.4em}.dh h1{margin:0;font-size:1.9em;line-height:1.2}
.dm{display:flex;gap:6px;align-items:center;margin-top:8px;color:var(--sec);flex-wrap:wrap}
.chip2{border:1px solid var(--hair);border-radius:6px;padding:0 8px;font-size:.9em}
.vs{display:inline-flex;background:var(--fill);border-radius:7px;padding:2px}.vs span{padding:2px 12px;border-radius:5px}.vs .on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.blk{display:flex;padding:2px 28px 2px 0}
.gt{width:4.2em;flex:none;text-align:right;padding:.55em 10px 0 0;font:.74em ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--sec);position:relative;letter-spacing:.02em}
.gt:after{content:"";position:absolute;right:0;top:3px;bottom:3px;width:3px;border-radius:2px}
.gt.ag:after{background:var(--accent)}.gt.you:after{background:var(--ink)}.gt.stt:after{background:var(--sec);opacity:.5}
.noauth .gt{visibility:hidden}
.bd{flex:1;min-width:0;padding-left:6px;line-height:1.6;font-size:1.04em}
.bd h2{margin:.5em 0 .2em;font-size:1.3em}.bd p{margin:.3em 0}.bd ul{margin:.2em 0;padding-left:1.3em}
.qc{font:.82em ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--fill);border-radius:4px;padding:1px 6px;color:var(--atext)}
.bd table{border-collapse:collapse;width:100%;margin:.4em 0;font-size:.97em}.bd th{text-align:left;color:var(--sec);font-weight:600;font-size:.88em}
.bd td,.bd th{border:1px solid var(--hair);padding:7px 10px;vertical-align:top}
.bd tr.you td{background:color-mix(in srgb,var(--ink) 4%,transparent)}.by{font-size:.85em;color:var(--sec)}
.cm{background:var(--tint);border-bottom:2px solid var(--accent);border-radius:2px}.sel{background:rgba(120,160,255,.35);border-radius:2px}
.pop{display:flex;flex-direction:column;gap:8px;position:absolute;margin-top:6px;width:20em;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--hair);box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:3;font-size:.95em}
.pop .pt{display:flex;gap:6px;align-items:center;font-weight:600}.pop .pi{border:1px solid var(--accent);border-radius:7px;padding:6px 8px;display:block}.pop .pa{display:flex;justify-content:flex-end;gap:12px;align-items:center}
.caret2{display:inline-block;width:1px;height:1em;background:var(--ink);vertical-align:-.15em;margin-left:1px}
.find{display:flex;align-items:center;gap:8px;margin:6px 28px 6px 5.4em;padding:5px 10px;border-radius:7px;background:var(--fill);color:var(--sec)}
.tl{display:flex;gap:12px;align-items:baseline}.tl b{width:5.5em;flex:none}.tl span{flex:1}.was{margin:2px 0 4px 6.8em;color:var(--sec);text-decoration:line-through;font-size:.92em}
.df{margin:12px 28px 0 5.4em;border:1px solid var(--hair);border-radius:8px;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}
.dl{display:flex;gap:10px;padding:5px 10px}.dl .gm{width:1em;color:var(--sec)}.dl .gx{flex:1}.dl .by2{color:var(--sec);font-size:.85em}
.dl.rm{background:color-mix(in srgb,var(--er) 12%,transparent)}.dl.rm .gm{color:var(--er)}.dl.ad{background:color-mix(in srgb,var(--ok) 13%,transparent)}.dl.ad .gm{color:var(--ok)}
.insp{width:min(23em,300px);flex:none;border-left:1px solid var(--hair);background:var(--side);display:flex;flex-direction:column;min-width:0}
.its{display:flex;align-items:center;gap:4px;height:2.7em;padding:0 10px;border-bottom:1px solid var(--hair);color:var(--sec)}
.it{display:inline-flex;gap:6px;align-items:center;padding:3px 8px;border-radius:6px}.it.on{background:var(--tint);color:var(--atext)}.it sup{font-size:.75em;color:var(--sec)}

function render(){

 document.querySelectorAll('#s-theme button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.theme));
 document.querySelectorAll('#s-lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.lang));
}
document.getElementById('s-theme').onclick=e=>{if(e.target.dataset.v){S.theme=e.target.dataset.v;render()}};
document.getElementById('s-lang').onclick=e=>{if(e.target.dataset.v){S.lang=e.target.dataset.v;render()}};
const qq=new URLSearchParams(location.search);if(qq.get('theme'))S.theme=qq.get('theme');if(qq.get('lang'))S.lang=qq.get('lang');
render();
