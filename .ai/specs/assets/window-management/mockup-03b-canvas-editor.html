<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup: canvas editor</title><style>
*{box-sizing:border-box}
:root{--win:#F6F4F0;--side:#E7E4DE;--card:#fff;--ink:#191610;--sec:#6B645A;--hair:rgba(25,22,16,.11);--accent:#267C6C;--atext:#036152;--tint:rgba(38,124,108,.14);--onacc:#fff;--ok:#1E8E3E;--att:#B25E00;--er:#D70015;--glass:rgba(255,255,255,.78);--fill:rgba(25,22,16,.06);--page:#d9d5cc;--wall1:#c9c3b6;--wall2:#9a948a;--onglyph:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--win:#1C1915;--side:#141210;--card:#26221E;--ink:#F1EEE9;--sec:#A39B8F;--hair:rgba(255,255,255,.11);--accent:#6BBDAB;--atext:#6BBDAB;--tint:rgba(107,189,171,.20);--onacc:#161310;--ok:#32D74B;--att:#FF9F0A;--er:#FF6961;--glass:rgba(38,34,30,.82);--fill:rgba(255,255,255,.08);--page:#0c0a08;--wall1:#3a3630;--wall2:#1f1c18;--onglyph:#161310}}
body{margin:0;padding:24px;background:var(--page);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
.cap{text-align:center;font-size:11px;color:var(--sec);margin-top:12px}
.win{background:var(--win);color:var(--ink);border:1px solid var(--hair);border-radius:12px;overflow:hidden;display:flex;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.25);margin:auto}
.lights{display:flex;gap:7px;padding:14px 14px 6px}.lights i{width:12px;height:12px;border-radius:50%;background:rgba(128,128,128,.35)}
.side{width:210px;flex:none;background:var(--side);border-right:1px solid var(--hair);display:flex;flex-direction:column;padding-bottom:12px}
.sg{font-size:11px;font-weight:600;color:var(--sec);padding:10px 14px 3px}
.si{display:flex;gap:8px;align-items:center;margin:1px 8px;padding:5px 8px;border-radius:7px}
.si.on{background:var(--tint)}.si.on .l{color:var(--atext);font-weight:600}.si .ic{color:var(--sec)}.si.on .ic{color:var(--atext)}
.si .off-t{margin-left:auto;font-size:11px;color:var(--sec)}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.pane{flex:1;padding:22px 28px;min-width:0;position:relative}
.pane h3{margin:0 0 12px;font-size:20px;line-height:1.2}
.bn{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--hair);margin:0 0 14px}
.bn .g{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--onglyph);flex:none;background:var(--sec);font-weight:700;font-size:13px}
.bn.ok .g{background:var(--ok)}.bn.att .g{background:var(--att)}.bn.er .g{background:var(--er)}
.bn .tx{flex:1;min-width:0}.bn .tt{font-weight:600}.bn .ss{color:var(--sec);font-size:12px}
.sh{font-size:11px;font-weight:600;color:var(--sec);margin:16px 0 5px 4px}
.card{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:2px 14px}
.fr{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid var(--hair);min-height:36px}
.fr:first-child{border-top:0}.fr .hp{color:var(--sec);font-size:12px}.fr .v{color:var(--sec);display:flex;gap:8px;align-items:center;flex:none}
.ft{color:var(--sec);font-size:12px;margin:8px 4px 0}
.disc{display:flex;gap:6px;align-items:center;color:var(--sec);font-weight:600;font-size:12px;margin:16px 4px 0}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:4px 12px;border:1px solid var(--hair);background:var(--card);color:var(--ink);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--onacc);border-color:transparent}.btn.sm{padding:2px 10px;font-size:12px}
.btn.dng{color:var(--er)}.btn.flat{background:none;border:0;color:var(--sec)}
kbd{font:600 11px -apple-system,sans-serif;background:var(--fill);border-radius:5px;padding:1px 6px;color:var(--sec)}
.sw{width:36px;height:21px;border-radius:11px;background:var(--hair);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw.on{background:var(--accent)}.sw.on:after{left:17px}
.pick{display:inline-flex;gap:6px;align-items:center;color:var(--ink);background:var(--fill);border-radius:7px;padding:2px 9px}
.pick .ch{color:var(--sec);font-size:9px}
.step{display:inline-flex;gap:8px;align-items:center;color:var(--ink)}.step b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--fill);color:var(--sec)}
.menu{border-radius:10px;background:var(--glass);backdrop-filter:blur(30px);border:1px solid var(--hair);padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.28);color:var(--ink)}
.mi{display:flex;gap:8px;padding:3px 10px;border-radius:5px;align-items:center;white-space:nowrap}.mi .r{margin-left:auto;color:var(--sec);padding-left:18px}
.mi.hl{background:var(--accent);color:var(--onacc)}.mi.hl .r{color:var(--onacc)}.mi.hd{color:var(--sec);font-size:11px;font-weight:600}
.msep{height:1px;background:var(--hair);margin:4px 8px}
.badge{font-size:10px;border-radius:9px;padding:0 7px;border:1px solid var(--hair);color:var(--sec);white-space:nowrap}
.cap-hud{white-space:nowrap;height:44px;border-radius:22px;background:var(--glass);backdrop-filter:blur(30px);border:1px solid var(--hair);display:inline-flex;align-items:center;gap:10px;padding:0 16px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.wall{border-radius:12px;background:linear-gradient(135deg,var(--wall1),var(--wall2));display:flex;gap:16px;flex-direction:column;align-items:center;justify-content:center;padding:22px}
.skel{background:var(--fill);height:14px;border-radius:6px;margin:10px 0}.dimmer{position:absolute;inset:0;background:rgba(0,0,0,.38)}.stage{position:relative;margin:auto;border-radius:12px;overflow:hidden}
.ed{position:absolute;box-shadow:0 20px 60px rgba(0,0,0,.4);border-radius:12px;display:flex;background:var(--win);border:1px solid var(--hair);overflow:hidden}
.eside{width:300px;flex:none;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--side);border-right:1px solid var(--hair)}
.lab{font-size:11px;font-weight:600;color:var(--sec);margin-top:4px}
.fld{background:var(--card);border:1px solid var(--hair);border-radius:7px;padding:4px 9px;display:flex;justify-content:space-between;align-items:center}
.zl{background:var(--card);border:1px solid var(--hair);border-radius:8px;overflow:hidden}
.zr{padding:6px 10px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--hair)}.zr:first-child{border-top:0}
.zr.on{background:var(--tint)}.zr.on .n{color:var(--atext);font-weight:600}.zr .p{margin-left:auto;color:var(--sec);font-size:11px;font-variant-numeric:tabular-nums}
.pos{font-size:11px;color:var(--sec);font-variant-numeric:tabular-nums;padding:2px 2px 0}
.erow{display:flex;gap:6px;flex-wrap:wrap}
.emain{flex:1;padding:16px 18px;display:flex;flex-direction:column;min-width:0}
.screen{flex:1;border-radius:8px;background:linear-gradient(135deg,var(--wall1),var(--wall2));position:relative;padding:0;overflow:hidden}
.z{position:absolute;border-radius:6px;border:1.5px solid rgba(255,255,255,.7);background:rgba(255,255,255,.18);display:grid;place-items:center}
.z.sel{background:color-mix(in srgb,var(--accent) 55%,transparent);border-color:var(--accent);border-width:2px}
.z .pill{background:#1c1915;color:#fff;border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;font-weight:600;font-size:13px;padding:0 8px}
.h{position:absolute;background:#fff;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.hint{color:var(--sec);font-size:11px;margin-top:10px}
.eft{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:10px}
</style><body><div class="win" style="width:880px;height:500px"><div class="eside" style="width:300px;overflow:hidden">
<div style="font-weight:600;font-size:15px">Edit layout</div>
<div><div class="lab">Name</div><div class="fld">Floating notes</div></div>
<div style="color:var(--sec)">Style: Canvas</div>
<div><div class="lab">Stacking (top first)</div><div class="zl">
<div class="zr"><span style="color:var(--sec)">&#8942;&#8942;</span><span class="n">Zone 3</span></div>
<div class="zr on"><span style="color:var(--sec)">&#8942;&#8942;</span><span class="n">Zone 2</span></div>
<div class="zr"><span style="color:var(--sec)">&#8942;&#8942;</span><span class="n">Zone 1</span></div></div></div>
<div><div class="lab">Zone 2 position (px)</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
<div class="fld"><span style="color:var(--sec)">X</span>576</div><div class="fld"><span style="color:var(--sec)">Y</span>260</div>
<div class="fld"><span style="color:var(--sec)">W</span>864</div><div class="fld"><span style="color:var(--sec)">H</span>470</div></div></div>
<div class="erow"><span class="btn sm">+ Add zone</span><span class="btn sm">Delete</span><span class="btn sm">Undo</span></div>
<div class="eft"><span class="btn">Cancel <kbd>Esc</kbd></span><span class="btn pri" style="margin-left:auto">Save <kbd style="background:rgba(255,255,255,.22);color:var(--onacc)">&#8984;S</kbd></span></div></div>
<div class="emain"><div style="margin-bottom:10px"><b>Preview</b></div><div class="screen"><div class="z " style="left:4%;top:6%;width:55%;height:62%;"><span class="pill">1</span></div><div class="z sel" style="left:40%;top:44%;width:45%;height:50%;"><span class="pill">2</span></div><div class="z " style="left:58%;top:10%;width:38%;height:45%;"><span class="pill">3</span></div><div class="h" style="left:84.5%;top:92%;width:7px;height:7px"></div><div class="h" style="left:40%;top:44%;width:7px;height:7px;transform:translate(-3px,-3px)"></div></div><div class="hint">Arrows move by 10 px &middot; &#8963; arrows by 1 px &middot; &#8679; arrows resize</div></div></div></body></html>
