name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test and lint
    # Xcode 27 (macOS 27 SDK, Swift 6.4) on Apple silicon. GitHub's Xcode 27 image is in public
    # preview; if the label disappears, macos-26 with Xcode 26 is the fallback (the code avoids
    # macOS 27-only APIs). See the Phase 0 PR for the decision.
    runs-on: xcode-27
    # Sum of the step limits below (about 40 min) plus checkout, toolchain, build and lint.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          submodules: true

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        timeout-minutes: 5
        with:
          xcode-version: latest-stable

      - name: Toolchain
        timeout-minutes: 2
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version
          sw_vers

      - name: Build
        timeout-minutes: 12
        run: swift build

      # After the build, which resolves the packages and so puts Sparkle's `sign_update` in .build/artifacts: the signing tests
      # in scripts/tests/test_appcast.zsh need it and fail (not skip) when CI is true and it is missing.
      - name: Script tests
        timeout-minutes: 6
        run: zsh scripts/tests/run.zsh

      - name: Test
        timeout-minutes: 16
        run: scripts/test-with-watchdog.sh --limit 800 --name test -- swift test

      - name: Test PluginHost under Thread Sanitizer
        timeout-minutes: 17
        run: scripts/test-with-watchdog.sh --limit 900 --name tsan-pluginhost -- swift test --sanitize=thread --filter "PluginHostTests|RecoveryOrderingTests|PluginServicesTests"

      - name: Test Notes writers and registry under Thread Sanitizer
        timeout-minutes: 6
        run: scripts/test-with-watchdog.sh --limit 220 --name tsan-notes -- swift test --sanitize=thread --filter NotesPluginTests

      - name: Test FileIndex and FilesPlugin under Thread Sanitizer
        timeout-minutes: 5
        run: scripts/test-with-watchdog.sh --limit 170 --name tsan-files -- swift test --sanitize=thread --filter FilesPluginTests

      - name: Test model leases under Thread Sanitizer
        timeout-minutes: 5
        run: scripts/test-with-watchdog.sh --limit 160 --name tsan-leases -- swift test --sanitize=thread --filter "SpeechEngineLeaseTests|LLMLeaseTests|ModelManagerRegistryTests|ModelManagerQueueTests|DictationSessionLeaseTests"

      - name: Test the window engine under Thread Sanitizer
        timeout-minutes: 5
        run: scripts/test-with-watchdog.sh --limit 170 --name tsan-windows -- swift test --sanitize=thread --filter "WindowEngineTests|WindowEngineConcurrencyTests|EventFlowTests|EngineStopTests|StopBudgetTests|EchoAndJournalOrderTests|RecoveryTests|StartStopRaceTests|WaiterLeakTests|LayoutStrategyTests|ToyStrategyTests|TilingEngineTests|ZoneEngineTests|ZoneDragControllerTests|ZoneDragSignalTests"

      - name: Test the provider process runner and the notes provider under Thread Sanitizer
        timeout-minutes: 8
        run: scripts/test-with-watchdog.sh --limit 360 --name tsan-providers -- swift test --sanitize=thread --filter "LintelProvidersTests|ProviderNotesMatrixTests|ProviderNotesGeneratorTests"

      # The shared latches and clocks every test target waits on (atomic registration, one resume, cancellation).
      - name: Test the shared test support under Thread Sanitizer
        timeout-minutes: 5
        run: scripts/test-with-watchdog.sh --limit 200 --name tsan-test-support -- swift test --sanitize=thread --filter LintelTestSupportTests

      - name: Format lint
        timeout-minutes: 3
        run: swift format lint --strict -r Sources Tests

      # A hung test run leaves stack samples and the names of the unfinished tests here (never test output).
      - name: Upload watchdog diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-watchdog
          path: ${{ runner.temp }}/test-watchdog
          if-no-files-found: ignore
          retention-days: 7
