name: Release

# A tag like v0.1.0 or v0.1.0-beta.1 builds Lintel.dmg, signs it with Developer ID, notarizes and staples it, and
# publishes a GitHub Release. The tag is the only source of the version: CFBundleShortVersionString is the tag
# without "v" and CFBundleVersion is the number of commits (scripts/stamp-version.sh); the release notes are the
# tag's section of CHANGELOG.md. A malformed tag, a tag outside main or a missing section fails the run in its first
# step.
#
# Three jobs (spec 2026-11-19-updates-and-open-source-hygiene, Step 2.3; docs/decisions/0012-distribution-and-updates.md):
#   build    every trigger. No secrets, no Environment. Tests, an ad-hoc signed app (uploaded as a zip made with
#            ditto, which keeps symlinks, permissions and extended attributes) and the release notes.
#   sign     the only job with the Environment `release` (the Developer ID and notary secrets). Runs only for a v*
#            tag and for a manual run with `sign: true` on main, never for a pull request. It builds no code of
#            the app, runs no tests and uses no third-party action: it takes ONLY the .app from the build job's artifact,
#            re-signs it with the repository's own scripts, notarizes and staples the app and the DMG, and verifies.
#            The only Swift it runs is scripts/ed25519.swift (about 40 lines, CryptoKit, run by `swift` to check the key pair).
#            It also holds the Sparkle EdDSA key (SPARKLE_ED_PRIVATE_KEY): it checks that the key belongs to the public
#            key in the app's Info.plist (before anything is signed), signs the DMG and builds and signs appcast.xml.
#   publish  tags only: the GitHub Release (with appcast.xml) and the website dispatch.
# Pull requests that touch the app, and manual runs without `sign`, build an ad-hoc DMG and upload it as a workflow
# artifact without signing or publishing anything.
on:
  # A push to main (a merged pull request) that touches the app builds the DMG too, so a source change that breaks
  # packaging shows up on main within minutes and not at the next tag. Nothing is published: `publish` runs for tags
  # only. The path filter does not apply to tag pushes.
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - Package.swift
      - Package.resolved
      - .gitmodules
      - Packages/**
      - Sources/**
      - Resources/**
      - scripts/**
      - .github/workflows/release.yml
  # Pull requests build the DMG only when packaging can change: the scripts, the bundle's plist and entitlements,
  # the package graph and this file. Source-only and docs-only pull requests are covered by ci.yml alone; the macOS
  # runners are few and this job repeats the whole test run. `Localizable.xcstrings` changes in most UI pull requests,
  # so it is left to `StringCatalogTests` in ci.yml and to the build on the push to main (above). To build a DMG for any other branch, run this workflow
  # by hand (workflow_dispatch).
  pull_request:
    paths:
      - Package.swift
      - Package.resolved
      - .gitmodules
      - Packages/**
      - Resources/Info.plist
      - Resources/*.entitlements
      - Resources/designated-requirement.txt
      - Resources/InfoPlist.xcstrings
      - Resources/THIRD_PARTY_NOTICES.txt
      - Resources/Assets.xcassets/**
      - Resources/KeyboardShortcuts/**
      - scripts/**
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign with Developer ID and notarize (only on main; asks the release Environment's reviewer). Publishes nothing."
        type: boolean
        default: false
      notary_wait_minutes:
        description: "Longest wait for Apple's verdict on the app, in minutes (1 to 240, default 40). An account's first submission can take hours; raise it for one long run instead of several. Tag runs always use 40. The DMG keeps 40."
        type: string
        default: "40"

permissions:
  contents: read

# Pull requests cancel their own older runs, as before. Every other event and ref has its own group and nothing running is cancelled.
# The event is part of the group: GitHub keeps only ONE waiting run per group and cancels the older waiting one, so
# without it a run started by hand on main (the signed run) was cancelled while waiting by the next push to main.
# Tag releases are serialised by the job-level group `release-tags` on `sign` and `publish` (below), not here: a
# workflow-level `queue: max` cannot be combined with `cancel-in-progress: true`.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (ad-hoc)
    # Dependabot pull requests get no DMG build: they get no secrets, and ci.yml already builds and tests them.
    if: github.actor != 'dependabot[bot]'
    # Same runner as CI: GitHub's Xcode 27 image (public preview, Apple silicon).
    runs-on: xcode-27
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          # The build number is the commit count, so the whole history is needed.
          fetch-depth: 0

      # A tag run fails here, before anything is built or signed, when the tag is not vX.Y.Z or vX.Y.Z-beta.N, when
      # the tagged commit is not on main, or when CHANGELOG.md has no (or an empty, or a duplicated) section for that
      # version. Every other run (pull request, manual) builds 0.0.0 with the commit count so the stamping path is
      # exercised too.
      - name: Version and release notes
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            APP_VERSION="$(scripts/version-from-tag.sh "$GITHUB_REF_NAME")"
            IS_PRERELEASE="$(scripts/version-from-tag.sh --is-prerelease "$GITHUB_REF_NAME")"
            # The build number is the commit count, which only grows along main: a release tag must be on main.
            git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
              echo "::error::Tag $GITHUB_REF_NAME is not on a commit of main. Release tags go on main only (the build number is the commit count)."
              exit 1
            fi
            mkdir -p dist
            scripts/changelog-section.sh "$APP_VERSION" > dist/release-notes.md
            cp CHANGELOG.md dist/CHANGELOG.md
          else
            APP_VERSION=0.0.0
            IS_PRERELEASE=false
          fi
          APP_BUILD="$(git rev-list --count HEAD)"
          echo "Version $APP_VERSION, build $APP_BUILD, pre-release: $IS_PRERELEASE"
          {
            echo "APP_VERSION=$APP_VERSION"
            echo "APP_BUILD=$APP_BUILD"
          } >> "$GITHUB_ENV"
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
        id: version

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version
          sw_vers

      # A push to main is tested by ci.yml on the same commit; here it only checks that the app still packages.
      - name: Test
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        timeout-minutes: 16
        run: scripts/test-with-watchdog.sh --limit 800 --name test -- swift test

      # A hung test run leaves stack samples and the names of the unfinished tests here (never test output).
      - name: Upload watchdog diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-watchdog
          path: ${{ runner.temp }}/test-watchdog
          if-no-files-found: ignore
          retention-days: 7

      # A tag builds the app only (the sign job makes the DMG from the signed app); every other run also builds an
      # ad-hoc DMG, so pull requests keep checking the DMG script.
      - name: Build app (and an ad-hoc DMG outside tags)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            scripts/make-app.sh
          else
            scripts/make-dmg.sh
            (cd dist && shasum -a 256 Lintel.dmg | tee Lintel.dmg.sha256)
          fi

      # ditto keeps symlinks (the frameworks' Versions/Current), permissions and extended attributes, which the
      # upload-artifact zip would not for a directory. The sign job takes this one file and nothing else from here.
      - name: Archive the app bundle
        run: |
          mkdir -p artifact-app
          ditto -c -k --keepParent dist/Lintel.app artifact-app/Lintel.app.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lintel-app
          path: artifact-app/Lintel.app.zip
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-notes
          path: |
            dist/CHANGELOG.md
            dist/release-notes.md
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: Lintel-adhoc-dmg
          path: |
            dist/Lintel.dmg
            dist/Lintel.dmg.sha256
          if-no-files-found: error

  sign:
    name: Sign and notarize (Developer ID)
    needs: build
    # Only a v* tag push, or a manual run with `sign` on main. Every alternative names its event, so a pull request
    # (event pull_request) can never satisfy it. scripts/ and the workflow are those of the tagged / main commit.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.sign == true && github.ref == 'refs/heads/main'
    environment: release
    # All tag runs share this group, `queue: max` (up to 100 waiting jobs; the default keeps one and cancels the
    # older ones), never cancelled: two tags pushed together both get signed, one after the other. `publish` has the
    # same group, so only one sign or publish job runs at a time. The group is per job, so the next tag's `sign` can
    # run between this tag's `sign` and `publish`; that is why `publish` checks the release order again.
    concurrency:
      group: release-tags
      queue: max
    runs-on: xcode-27
    # Worst case = upload (10) + app wait (default 40, a manual run may raise it to 240) + DMG upload (10) + DMG wait (always
    # 40, the account is warm once the app was accepted) + about 10 minutes for the rest = 310 minutes for the largest
    # allowed input; each status read is bounded at 2 minutes, so each wait overshoots by at most about 2.5 minutes and
    # a rejection's log fetch adds at most 2: about 319. GitHub-hosted jobs stop at 360. A first submission can sit In Progress for hours at Apple; the
    # bounded wait fails the step with the submission id instead of the job being cut.
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      IS_TAG_RUN: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The order check below needs the history and the tags.
          fetch-depth: 0

      # First thing in the serialised job, before any secret is used: a tag must point at a strict descendant of the
      # commit of the newest published release (drafts ignored, pre-releases included), so build numbers and
      # publication order agree. No release yet passes. Manual runs publish nothing and skip it. `publish` repeats it.
      - name: Check the release order
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-release-order.sh --github "$GITHUB_SHA" "$GITHUB_REF_NAME"

      # No third-party action in this job: Apple's tools, the repository's scripts and the two first-party actions.
      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1 || true)"
          if [[ -n "$XCODE" ]]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun notarytool --version
          xcrun --find stapler

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Lintel-app
          path: artifact-app

      # Only the .app is taken from the artifact (nothing else in it is used or run), into the place the scripts expect.
      - name: Take the app bundle
        run: |
          [[ "$(ls artifact-app | wc -l | tr -d ' ')" == 1 && -f artifact-app/Lintel.app.zip ]] \
            || { echo "::error::The Lintel-app artifact must hold exactly Lintel.app.zip."; exit 1; }
          EXTRACT="$RUNNER_TEMP/app-extract"
          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT" dist
          ditto -x -k artifact-app/Lintel.app.zip "$EXTRACT"
          [[ -d "$EXTRACT/Lintel.app/Contents/MacOS" ]] || { echo "::error::The artifact holds no Lintel.app."; exit 1; }
          rm -rf dist/Lintel.app
          ditto "$EXTRACT/Lintel.app" dist/Lintel.app
          rm -rf "$EXTRACT" artifact-app
          plutil -lint dist/Lintel.app/Contents/Info.plist

      # sign_update, from Sparkle's release zip, checked against the SHA-256 committed in scripts/sparkle-tools.txt before
      # anything is extracted. One binary is all this job needs; resolving the package graph would fetch every
      # dependency of the app into a job that holds secrets.
      - name: Fetch the Sparkle tools
        run: |
          SIGN_UPDATE="$(scripts/fetch-sparkle-tools.sh "$RUNNER_TEMP/sparkle")"
          echo "SPARKLE_SIGN_UPDATE=$SIGN_UPDATE" >> "$GITHUB_ENV"

      # Fails the run, before the hours of notarization and before anything is published, when the Sparkle private key is
      # not the partner of SUPublicEDKey in the app being released: an app with that public key would reject every update
      # signed by this key. The key goes to sign_update through stdin only; no output of sign_update is shown.
      - name: Check the Sparkle signing key against the app's public key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/sparkle-sign.sh check-key dist/Lintel.app/Contents/Info.plist

      - name: Import the Developer ID certificate into a temporary keychain
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/lintel-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Export the path at once, so the cleanup step deletes the keychain even if a later command
          # in this step fails.
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          P12="$RUNNER_TEMP/lintel-signing.p12"
          trap 'rm -f "$P12"' EXIT
          (umask 077 && printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$P12")
          security import "$P12" -k "$KEYCHAIN" -f pkcs12 -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      # The identity is found in the imported certificate, not named in the repository. Exactly one Developer ID
      # Application identity must be there, and it must belong to the Team ID committed in scripts/release-team-id.txt.
      # The log shows the Team ID only, not the name on the certificate.
      - name: Find the signing identity
        run: |
          TEAM_ID="$(tr -d '[:space:]' < scripts/release-team-id.txt)"
          LIST="$(security find-identity -v -p codesigning "$SIGN_KEYCHAIN" | grep 'Developer ID Application:' || true)"
          COUNT="$(printf '%s' "$LIST" | grep -c . || true)"
          if [[ "$COUNT" != 1 ]]; then
            echo "::error::Expected exactly one valid Developer ID Application identity in the imported certificate, found $COUNT."
            exit 1
          fi
          if ! printf '%s' "$LIST" | grep -q "($TEAM_ID)\""; then
            echo "::error::The imported Developer ID identity does not belong to Team ID $TEAM_ID (scripts/release-team-id.txt)."
            exit 1
          fi
          HASH="$(printf '%s' "$LIST" | awk '{print $2}')"
          echo "Developer ID Application identity for Team ID $TEAM_ID found."
          echo "SIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"

      - name: Re-sign the app (inside-out, hardened runtime, secure timestamp)
        run: scripts/make-app.sh --sign-only

      - name: Notarize the app
        env:
          # Empty (tag runs, other triggers) means the script's default of 40 minutes; the script validates it.
          NOTARY_WAIT_MINUTES: ${{ inputs.notary_wait_minutes }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/notary"
          ditto -c -k --keepParent dist/Lintel.app "$RUNNER_TEMP/notary/Lintel-app.zip"
          scripts/notarize.sh "$RUNNER_TEMP/notary/Lintel-app.zip" notary-logs

      - name: Staple the app
        run: |
          xcrun stapler staple dist/Lintel.app
          xcrun stapler validate dist/Lintel.app

      # The DMG is made from the stapled app, so the ticket travels inside it.
      - name: Build and sign the DMG
        run: scripts/make-dmg.sh --skip-build

      - name: Notarize and staple the DMG
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          scripts/notarize.sh dist/Lintel.dmg notary-logs
          xcrun stapler staple dist/Lintel.dmg
          xcrun stapler validate dist/Lintel.dmg

      # After the last change to the DMG (signing, notarizing, stapling), never before.
      - name: Checksum
        run: |
          cd dist
          shasum -a 256 Lintel.dmg | tee Lintel.dmg.sha256

      - name: Verify the signed, notarized bundle
        run: |
          mkdir -p requirement
          REQUIREMENT_OUT="$PWD/requirement/designated-requirement.txt" scripts/verify-release-bundle.sh dist/Lintel.app dist/Lintel.dmg

      # The previous feed supplies the other channel's item: the newest published release that has an appcast.xml (the one
      # the site serves). Tag runs only, and the script knows that (it fetches nothing for another run), so this step has
      # no `if:` that could skip it. A failing `gh` fails the step: an API error must never look like "no previous release",
      # because the feed would then be rebuilt without the other channel's item. The file is only data here:
      # release-appcast.sh refuses it unless its signature verifies.
      - name: Fetch the previous appcast
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty for a run that is not a tag run: the script then fetches nothing.
          FEED_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: scripts/fetch-previous-appcast.sh appcast "$FEED_TAG"

      # Signs the DMG, builds the feed and signs and verifies it (scripts/release-appcast.sh). A previous feed that is
      # present but does not verify fails the job (dropping it would remove the other channel's item). A manual run does
      # the same but deletes the feed: it is for version 0.0.0, validly signed with the production key, and must not be
      # downloadable. Only tag runs keep it for the upload below.
      - name: Sign the DMG and build the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/release-appcast.sh dist/Lintel.app/Contents/Info.plist dist/Lintel.dmg appcast

      # Tag runs only: a manual run has no feed left (see above).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Lintel-appcast
          path: |
            appcast/appcast.xml
            appcast/previous-tag.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lintel-dmg
          path: |
            dist/Lintel.dmg
            dist/Lintel.dmg.sha256
          if-no-files-found: error

      # What Step 3.4 records in Resources/designated-requirement.txt.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lintel-requirement
          path: requirement/designated-requirement.txt
          if-no-files-found: error

      # While Resources/designated-requirement.txt holds the placeholder, a tag run fails here (after the checks and the
      # uploads above) and a manual run only warns. With a recorded requirement the two must be equal.
      - name: Compare with the recorded requirement
        run: |
          if [[ "$IS_TAG_RUN" == true ]]; then MODE=fail; else MODE=warn; fi
          scripts/requirement.sh compare Resources/designated-requirement.txt requirement/designated-requirement.txt --on-placeholder "$MODE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # The notary log of a rejection and the submission id files (also after a cancelled or timed-out job).
        if: always()
        with:
          name: notary-logs
          path: notary-logs
          if-no-files-found: ignore

      - name: Remove the temporary keychain
        if: always() && env.SIGN_KEYCHAIN != ''
        run: |
          security delete-keychain "$SIGN_KEYCHAIN" || true

  publish:
    name: Publish GitHub Release
    needs: [build, sign]
    concurrency:
      group: release-tags
      queue: max
    # Follow-up (spec Step 2.4): `environment: publish` for LINTEL_WEB_DISPATCH_TOKEN; that Environment does not exist yet.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The order check below needs the history and the tags.
          fetch-depth: 0

      # Again, now that every earlier tag's publish has finished (this job holds the `release-tags` group): the tag of
      # another release may have been signed and published since this tag's `sign` checked. Nothing is published unless
      # this tag is a strict descendant of the newest published release.
      - name: Check the release order again
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-release-order.sh --github "$GITHUB_SHA" "$GITHUB_REF_NAME"

      # Lintel-dmg comes from the sign job (the notarized DMG and its checksum), release-notes from the build job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Lintel-dmg
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Lintel-appcast
          path: appcast

      # The feed was built in `sign` from the previous release's feed. If another release was published since, that feed
      # lacks its item and publishing it would drop the other channel's entry: stop, and run the tag again after the
      # newer release (a tag that was already pushed is not reused: tag the next version).
      - name: Check the appcast is built on the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-appcast-base.sh appcast/previous-tag.txt "$GITHUB_REF_NAME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          SHA256="$(cut -d' ' -f1 dist/Lintel.dmg.sha256)"
          # The install text first, then this version's section of CHANGELOG.md (the build job extracted it).
          [[ "$(ls dist/*.dmg | wc -l | tr -d ' ')" == 1 && "$(ls dist/*.dmg.sha256 | wc -l | tr -d ' ')" == 1 ]] \
            || { echo "::error::A release carries exactly one .dmg and one .dmg.sha256."; exit 1; }
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Install

          1. Download **Lintel.dmg** below and open it.
          2. Drag **Lintel** onto the **Applications** folder.
          3. Open Lintel from Applications. A ring with a small cut appears in the menu bar.

          Requires macOS 26 or later on Apple silicon.

          ## Signed and notarized

          Lintel is free and open source. It is signed with an Apple Developer ID and notarized by Apple,
          so macOS opens it with its ordinary first-open confirmation.

          SHA-256 of \`Lintel.dmg\`: \`${SHA256}\`

          ## What's changed

          EOF
          cat dist/release-notes.md >> "$RUNNER_TEMP/notes.md"
          PRERELEASE_FLAG=()
          if [[ "$PRERELEASE" == true ]]; then
            PRERELEASE_FLAG=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/Lintel.dmg dist/Lintel.dmg.sha256 dist/CHANGELOG.md appcast/appcast.xml \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Lintel ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${PRERELEASE_FLAG[@]}"

      # The website (lintel-web, Cloudflare Pages) reads the latest release at build time: version, DMG size
      # and SHA-256. This sends it a `release-published` repository_dispatch so it rebuilds. It runs only after
      # the release exists, and it can never fail the release: a missing token skips it, a failed call is a
      # warning (lintel-web can also be redeployed by hand with workflow_dispatch). The token (a fine-grained
      # personal access token limited to lintel-web, Contents: read and write) is passed to `gh` through the
      # environment only, never on a command line, and the payload carries just the tag.
      - name: Rebuild the website
        env:
          GH_TOKEN: ${{ secrets.LINTEL_WEB_DISPATCH_TOKEN }}
          WEBSITE_REPO: mjozefiak/lintel-web
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::LINTEL_WEB_DISPATCH_TOKEN is not set, so the website was not asked to rebuild. The feed at https://lintelapp.com/appcast.xml stays at the previous release's until lintel-web is rebuilt: redeploy it by hand (workflow_dispatch)."
            exit 0
          fi
          if gh api --method POST "repos/${WEBSITE_REPO}/dispatches" \
            -f event_type=release-published \
            -f "client_payload[tag]=${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Website rebuild requested."
            echo "SITE_REBUILD_REQUESTED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::The website dispatch failed. The release is published; redeploy lintel-web by hand (workflow_dispatch)."
          fi

      # The site (another repository) copies the release's appcast.xml into lintelapp.com when it rebuilds. Waits until
      # the live feed equals this release's, for ten minutes in total (a deadline, not a count of tries), and only warns
      # when it does not: the release itself is valid and the feed on the site stays at the previous, validly signed
      # version. It runs even when the dispatch was not sent (the site may rebuild by itself; the script warns that it was
      # not asked). Never fails the job.
      - name: Wait for the site to serve the new feed
        run: scripts/wait-for-site-feed.sh appcast/appcast.xml --deadline 600 --interval 30
