name: Release

# A tag like v0.1.0 builds Pounce.dmg, signs it with the stable self-signed "Pounce Release" identity
# and publishes a GitHub Release. Pull requests that touch the app and manual runs build and sign the
# same DMG and upload it as a workflow artifact without publishing anything.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Package.swift
      - Package.resolved
      - .gitmodules
      - Packages/**
      - Sources/**
      - Resources/**
      - scripts/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build signed DMG
    # Same runner as CI: GitHub's Xcode 27 image (public preview, Apple silicon).
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      SIGNING_P12: ${{ secrets.SIGNING_P12 }}
      SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
      IDENTITY: Pounce Release
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version
          sw_vers

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $VERSION in Resources/Info.plist"
            exit 1
          fi

      - name: Require signing secrets for releases
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNING_P12 == ''
        run: |
          echo "::error::SIGNING_P12 is not available; a release must be signed with the Pounce Release identity."
          exit 1

      - name: Import signing certificate into a temporary keychain
        if: env.SIGNING_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/pounce-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          P12="$RUNNER_TEMP/pounce-signing.p12"
          printf '%s' "$SIGNING_P12" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN" -f pkcs12 -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # The certificate is self-signed, so it is not trusted. codesign signs with it anyway; if a
          # runner image ever refuses, trust it on this ephemeral runner only.
          PROBE="$RUNNER_TEMP/probe"
          cp /usr/bin/true "$PROBE"
          if ! codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "$PROBE" 2>/dev/null; then
            echo "codesign refused the untrusted identity; trusting it on this runner only."
            security find-certificate -c "$IDENTITY" -p "$KEYCHAIN" > "$RUNNER_TEMP/pounce-signing.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/pounce-signing.pem"
            codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "$PROBE"
          fi
          rm -f "$PROBE"
          security find-identity -p codesigning "$KEYCHAIN" | sed -E 's/[0-9A-F]{40}/<sha1>/'

          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Build app and DMG
        run: scripts/make-dmg.sh

      - name: Verify signature and designated requirement
        if: env.SIGN_IDENTITY != ''
        run: |
          codesign --verify --strict --deep --verbose=2 dist/Pounce.app
          codesign -dv dist/Pounce.app 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|CodeDirectory)'
          codesign -dr - dist/Pounce.app 2>/dev/null | tee dist/designated-requirement.txt
          grep -q 'identifier "app.pounce.Pounce"' dist/designated-requirement.txt
          # A self-signed identity is a one-certificate chain, so codesign pins it as the leaf
          # (identical to the root): the requirement names that certificate's hash.
          grep -Eq 'certificate (leaf|root) = H"[0-9a-f]{40}"' dist/designated-requirement.txt
          if grep -q cdhash dist/designated-requirement.txt; then
            echo "::error::The designated requirement is a cdhash: the app was signed ad-hoc."
            exit 1
          fi
          if [[ -f Resources/designated-requirement.txt ]]; then
            if ! diff -u Resources/designated-requirement.txt dist/designated-requirement.txt; then
              echo "::error::The designated requirement changed. Users would lose their TCC grants (BACKWARD_COMPATIBILITY.md section 4)."
              exit 1
            fi
          fi

      - name: Second build keeps the same designated requirement
        if: env.SIGN_IDENTITY != ''
        run: |
          mv dist/Pounce.app "$RUNNER_TEMP/Pounce-first.app"
          scripts/make-app.sh
          codesign -dr - dist/Pounce.app 2>/dev/null > "$RUNNER_TEMP/designated-requirement-2.txt"
          diff -u dist/designated-requirement.txt "$RUNNER_TEMP/designated-requirement-2.txt"
          echo "Two consecutive builds have the same designated requirement."

      - name: Checksum
        run: |
          cd dist
          shasum -a 256 Pounce.dmg | tee Pounce.dmg.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: Pounce-dmg
          path: |
            dist/Pounce.dmg
            dist/Pounce.dmg.sha256
            dist/designated-requirement.txt
          if-no-files-found: error

      - name: Remove the temporary keychain
        if: always() && env.SIGN_KEYCHAIN != ''
        run: |
          security delete-keychain "$SIGN_KEYCHAIN" || true

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Pounce-dmg
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA256="$(cut -d' ' -f1 dist/Pounce.dmg.sha256)"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Install

          1. Download **Pounce.dmg** below and open it.
          2. Drag **Pounce** onto the **Applications** folder.
          3. Open Pounce from Applications. A paw icon appears in the menu bar.

          Requires macOS 26 or later on Apple silicon.

          ## First launch: Gatekeeper

          Pounce is free and open source. It is signed with its own stable certificate ("Pounce Release")
          so macOS keeps your permissions across updates, but it is **not notarized** by Apple. The first
          time you open it, macOS blocks it. To allow it once:

          1. Open Pounce and close the warning.
          2. Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway** next to
             the Pounce message, then confirm.

          Right-click → Open no longer skips this check on current macOS. Alternatively, in Terminal:

          \`\`\`bash
          xattr -dr com.apple.quarantine /Applications/Pounce.app
          \`\`\`

          SHA-256 of \`Pounce.dmg\`: \`${SHA256}\`
          EOF
          gh release create "$GITHUB_REF_NAME" dist/Pounce.dmg dist/Pounce.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Pounce ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
